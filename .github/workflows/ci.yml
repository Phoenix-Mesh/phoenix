name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      # The MQTT integration tests start a real broker; without it they are skipped.
      - name: Install Mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mosquitto
          sudo systemctl stop mosquitto || true

      # Ubuntu's packaged Mosquitto is confined by AppArmor.
      # The integration tests need it to read JUnit's temporary config files.
      - name: Configure Mosquitto for integration tests
        run: |
          mkdir -p "$RUNNER_TEMP/phoenix-ci-bin"

          cat > "$RUNNER_TEMP/phoenix-ci-bin/mosquitto" <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/aa-exec -p unconfined -- /usr/sbin/mosquitto "$@"
          EOF

          chmod +x "$RUNNER_TEMP/phoenix-ci-bin/mosquitto"
          echo "$RUNNER_TEMP/phoenix-ci-bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./gradlew --no-daemon --console=plain clean build

      - name: Test summary
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-summary.py build/test-results/test >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

      - name: Upload distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: phoenix-dist
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for tracked build output
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(build|\.gradle|out)/|\.class$|\.jar$' \
            | grep -v '^gradle/wrapper/gradle-wrapper\.jar$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Build output or binaries are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Check whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git -c core.whitespace=cr-at-eol diff --check "origin/${BASE_REF}...HEAD"
